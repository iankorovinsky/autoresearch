[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kernel-compute"
version = "0.1.0"
description = "Provider-independent queued GPU kernel execution"
requires-python = ">=3.12"
dependencies = [
    "modal>=1.6,<2",
    "pydantic>=2.12,<3",
]

[project.scripts]
kcompute = "kernel_compute.cli:main"

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.14"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: opt-in scheduler-managed tests on gpu-8-vm"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
