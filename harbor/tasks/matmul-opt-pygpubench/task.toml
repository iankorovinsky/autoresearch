schema_version = "1.4"
artifacts = ["/workspace/candidate.py"]

[task]
name = "se390/matmul-opt-pygpubench"
version = "1.0.0"
description = "Improve a CUDA matrix multiplication kernel, verified through KernelBench correctness and PyGPUBench adversarial timing."
authors = [{ name = "Julia Ilioukhina" }]
keywords = ["cuda", "kernelbench", "pygpubench", "kernel-optimization"]

[metadata]
difficulty = "medium"
category = "gpu-kernel-optimization"

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 1800.0

[environment]
network_mode = "public"
build_timeout_sec = 2400.0
os = "linux"
cpus = 4
memory_mb = 16384
storage_mb = 20480
gpus = 1
gpu_types = ["L4"]
