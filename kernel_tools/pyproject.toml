[project]
name = "kernel-tools"
version = "0.1.0"
description = "Harness-agnostic kernel evaluation and profiling tools, exposed as an MCP server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2,<3",
    "modal>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kernel-tools-mcp = "kernel_tools.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kernel_tools"]
